# Registry of projects rememory indexes. COPY THIS FILE to projects.yaml and
# edit -- projects.yaml is yours (gitignored); this example is the template.
#
# The `name` key lands in every indexed chunk's `project` field and is what
# you pass to the search tools. Renaming a project after indexing orphans its
# vectors -- re-index after any rename.
#
# Add a project:
#   1. add an entry below (in projects.yaml)
#   2. uv run -m indexer.cli index --project <name>

# Deliberately empty. rememory does NOT index itself: you installed it to
# remember YOUR projects, and indexing the tool's own source only spends time
# at setup and pollutes search results with rememory's internals. Register
# real projects instead -- just ask your assistant to "create a knowledge base
# for this project in rememory", or add an entry below by hand.

projects: {}

  # my-app:
  #   root: C:\code\my-app     # absolute paths work anywhere
  #   description: >-
  #     One or two sentences about what this project is. Shown in briefings.
  #   extra_ignore_dirs: []    # ADDED to the global ignore rules, never replaces
  #   include_only: []         # restrict to subtrees; empty = whole root

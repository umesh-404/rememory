# CI: what can be verified without Docker/Ollama.
#
# The full stack (Qdrant + Ollama + GPU) can't run in hosted CI, so CI covers
# the service-free surface: lint, byte-compile, and the unit suite (chunkers,
# sparse determinism, secret redaction). The service-backed suites
# (test_roundtrip, test_mcp_server, eval_retrieval) run on developer machines
# -- see CONTRIBUTING.md.

name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync
      - name: Lint
        run: uv run ruff check .
      - name: Byte-compile everything
        # app/ is included even though its extra isn't installed -- compileall
        # checks syntax without importing, so pywebview/pystray aren't needed.
        run: uv run python -m compileall -q app indexer memory_mcp scripts tests
      - name: Unit tests (service-free)
        run: uv run tests/test_unit.py

[project]
name = "rememory"
version = "0.4.0"
description = "rememory: local, private development memory for Claude Code (Qdrant + Ollama + MCP)"
requires-python = ">=3.12"
license = { file = "LICENSE" }

# Every dependency below is justified in docs/04-indexing.md. Kept deliberately
# small: each one is a thing that can break, and this system is meant to still
# work in three years.
dependencies = [
    "qdrant-client>=1.12",          # official Qdrant SDK (REST + gRPC)
    "httpx>=0.27",                  # HTTP client for Ollama; sync + async, one API
    "pyyaml>=6.0",                  # reads config/*.yaml
    "pathspec>=0.12",               # the .gitignore matching algorithm, exactly
    "tree-sitter>=0.23",            # incremental parsers -> real symbol boundaries
    "tree-sitter-language-pack>=0.9",  # prebuilt grammars, no C compiler needed
    "rich>=13.0",                   # progress bars and readable tables in the CLI
    "mcp>=1.2",
]

[project.optional-dependencies]
# The desktop app (tray icon + dashboard). Optional so a headless install
# never has to pull GUI libraries: `uv sync --extra app` enables it.
app = [
    "pywebview>=5.0",   # native OS webview -- no bundled browser engine
    "pystray>=0.19",    # system tray icon
    "pillow>=10.0",     # pystray's image dependency; also draws our icon
]

[dependency-groups]
dev = ["ruff>=0.8"]

[project.scripts]
memory-index = "indexer.cli:main"
rememory-app = "app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["indexer", "memory_mcp", "app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "SIM117"]
"scripts/*" = ["E501", "B905", "B904"]
